packages:
  - "apps/*"
  - "libs/*"

# Force every transitive @n3ary/gtfs-spec dep to resolve to this
# workspace's local checkout (link:../libs/spec) instead of fetching
# the published GH Packages tarball. Without this, downstream packages
# like @n3ary/gtfs-adapter-cluj-napoca@0.2.0 (which declares
# "@n3ary/gtfs-spec": "^0.3.2" as a production dep) trigger a 401
# when CI tries to read the org's private spec package. Single source
# of truth: workspace-only.
#
# `link:../libs/spec` (the same target resolved inside the workspace's
# importer entries) is used in preference to `workspace:*` because
# the latter caused pnpm 11.5 to also downgrade Vite (vitest@4.1.9's
# peer fell back to vite@5.4.21 instead of vite@8.x). `link:` is the
# most-specific syntax — it doesn't trigger the cross-package
# resolution path that perturbates vitest's peer resolution.
overrides:
  '@n3ary/gtfs-spec': workspace:*
  # protobufjs-cli@1.3.3 (transitive via gtfs-realtime-bindings) lists
  # `glob: ^8`, which transitively pulls in inflight@1.0.6 - both
  # npm-deprecated (memory leak + EOL). glob@9+ removed the inflight
  # dep. We don't call protobufjs-cli at runtime (the bindings are
  # the only thing used), so a major-version bump in their glob dep
  # can't break our code paths. If it ever does, the failure mode is
  # at `pnpm install` (proto parsing of the installed CLI's
  # postinstall) or at first `gtfs-realtime-bindings` call - both
  # surface immediately in `pnpm check` / `pnpm test`.
  #
  # glob@13.x is the current major (npm-deprecated: false at the
  # time of writing); glob@10/11/12 are intermediate majors that
  # pnpm 11 still flags as deprecated. ^13 keeps us on the
  # maintained line and gives inflight the boot.
  glob: ^13.0.6
  # Dependabot alerts — all transitive, no upstream range yet
  # admits a patched release. Each entry names the advisory it clears
  # and the path the package enters the tree by.
  #   #8  protobufjs    CVE-2026-59877 (DoS via infinite loop in
  #                    .proto option parsing) - 7.6.4 -> 7.6.5
  #   #9, #18-21 fast-uri host confusion / SSRF via percent-encoded
  #                    scheme, IPv6 and repeated hostname decoding
  #                    (<= 3.1.5) - 3.1.3 -> 3.1.6
  #   #10 find-my-way  CVE-2026-47219 (DDoS with HTTP2) - 9.6.0 -> 9.7.0
  #   #11, #26 brace-expansion DoS advisories (CVE-2026-14257 unbounded
  #                    expansion length, plus the nested-group and
  #                    parseCommaParts recursion advisories)
  #                    (< 5.0.12) - 5.0.7 -> 5.0.12
  #   #16, #17 fastify schema validation bypass, X-Forwarded-* spoofing
  #                    and an unhandled exception on HTTP/2 trailer
  #                    responses (< 5.12.5) - 5.9.0 -> 5.12.5
  #   #22 csv-parse    prototype replacement still reachable via the
  #                    columns path (< 7.0.2) - via libs/spec
  #   #23, #24 vitest  path traversal / arbitrary file read via
  #                    @vitest/mocker redirect mock, code injection via
  #                    unauthenticated manual mock registration and the
  #                    Windows backslash traversal bypass
  #                    (< 4.1.12) - 4.1.9 -> 4.1.12
  #   #25, #33-38 markdown-it quadratic-time parsing DoS
  #                    (< 14.3.3) - via jsdoc (protobufjs-cli) and
  #                    markdown-it-anchor
  #   #32 source-map-js event-loop DoS via indexed source-map section
  #                    offsets (< 1.2.2) - via postcss
  #   #34, #36, #37 vite launch-editor flag misinterpretation and the
  #                    Windows fs.existsSync() bypass (<= 8.1.5) - via
  #                    vitest
  # Only the 5.x line of brace-expansion is pulled in here, so a
  # single `^5.0.12` override suffices. (gtfs-adapters also pulls
  # 2.x via CJS minimatch and needs the selector form - see that
  # repo's pnpm-workspace.yaml for the per-major pins.)
  # Drop these once upstream ranges admit the patched versions
  # (ajv for fast-uri, fastify for find-my-way, tailwindcss for
  # protobufjs via vite-plugin-pwa for brace-expansion).
  # zod (< 4.6.6, memory exhaustion on oversized constrained
  # collections) and serialize-javascript (< 7.1.3, XSS via an unescaped
  # </script in a serialized function body) are not flagged by
  # Dependabot at all and were found with pnpm audit. fast-copy
  # (< 3.1.0, stack exhaustion when copying deeply-nested values) is
  # likewise unflagged; it enters via pino-pretty, whose own range
  # (^3.0.2) already admits the patched release.
  protobufjs: ^7.6.5
  fast-uri: ^3.1.6
  find-my-way: ^9.7.0
  brace-expansion: ^5.0.12
  postcss: ^8.5.23
  markdown-it: ^14.3.3
  source-map-js: ^1.2.2
  csv-parse: ^7.0.2
  zod: ^4.6.6
  serialize-javascript: ^7.1.3
  fast-copy: ^3.1.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

# pnpm 11 supply-chain policy rejects packages published within the
# minimum release age cutoff (default 24h). Disable for this
# internal monorepo: every @n3ary dep is published by us and we
# trust our own publish pipeline. (Minutes; 0 = no cutoff.)
minimumReleaseAge: 0

# pnpm 11 has a SEPARATE tarball-hash check that runs even when
# minimumReleaseAge is 0: `pnpm install` re-fetches each internal
# dep's tarball and verifies its sha512 against what the registry
# serves now. After a fresh publish (CI re-builds the lockfile +
# GH Packages re-signs the tarball), the two can disagree for ~5
# minutes and produce `ERR_PNPM_TARBALL_URL_MISMATCH` in CI even
# though locally everything works.
#
# `trustPolicy: off` means "use the lockfile hashes as the
# source of truth, don't re-verify against the live registry" —
# same intent as `--trust-lockfile` on the CLI but persistent
# across every `pnpm install` in every workflow. The lockfile is
# part of the source tree and goes through PR review, so its
# hashes are already trusted. This eliminates the post-publish
# cache-lag failure mode without weakening security (an attacker
# who can rewrite the lockfile can already rewrite the code).
trustPolicy: off
